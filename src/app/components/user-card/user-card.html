<div
  class="bg-white border-2 rounded-lg p-6 shadow-sm transition-all"
  [class.border-green-500]="isActive()"
  [class.border-red-400]="!isActive()"
>
  <div class="flex justify-between items-start">
    <div>
      <h2 class="text-xl font-bold text-gray-800">{{ userName() }}</h2>
      <p class="text-indigo-500 font-medium">{{ role() }}</p>
    </div>
    <span
      class="px-2 py-1 rounded text-xs font-bold uppercase"
      [class]="isActive() ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
    >
      {{ isActive() ? 'En línea' : 'Desconectado' }}
    </span>
  </div>

  <div class="mt-4 min-h-[70px]">
    @if (isActive()) {
      <label class="block text-sm text-gray-500 mb-1">Editar nombre:</label>
      <input
        type="text"
        [(ngModel)]="userName"
        class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
      />
    } @else {
      <div
        class="bg-gray-50 h-full p-3 rounded-md border border-gray-200 flex items-center justify-center"
      >
        <p class="text-sm text-gray-500 italic">🔒 Edición deshabilitada (Desconectado).</p>
      </div>
    }
  </div>

  <div class="mt-6">
    <button
      (click)="darLike()"
      class="bg-pink-500 hover:bg-pink-600 text-white px-3 py-1 rounded-full text-sm flex items-center gap-2 transition-colors"
    >
      ❤️ {{ likes() }}
    </button>
  </div>
</div>
