<main class="min-h-screen bg-gray-100 p-8">
  <h1 class="text-3xl font-bold text-center text-blue-600 mb-8">Directorio de Usuarios</h1>

  <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md border border-gray-200 mb-10">
    <h2 class="text-xl font-semibold mb-4 text-gray-700">Agregar nuevo usuario</h2>

    <form (ngSubmit)="saveUser()" class="flex flex-col gap-4">
      <div>
        <label class="block text-sm text-gray-600 mb-1">Nombre del usuario</label>
        <input
          type="text"
          name="userName"
          [(ngModel)]="newUserName"
          class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Ej. Ana Pérez"
          required
        />
      </div>

      <div>
        <label class="block text-sm text-gray-600 mb-1">Rol</label>
        <input
          type="text"
          name="userRole"
          [(ngModel)]="newUserRole"
          class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Ej. Frontend Developer"
          required
        />
      </div>

      <button
        type="submit"
        class="mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition-colors self-end"
      >
        Guardar Usuario
      </button>
    </form>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
    @for (user of users(); track user.id) {
      <app-user-card
        [(userName)]="user.name"
        [role]="user.role"
        [isActive]="user.active"
      ></app-user-card>
    } @empty {
      <p class="text-gray-500 col-span-full text-center">No hay usuarios en el sistema.</p>
    }
  </div>
</main>

<router-outlet></router-outlet>
